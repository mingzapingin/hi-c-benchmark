[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Package metadata
# ---------------------------------------------------------------------------

[project]
name = "hic-benchmark"
version = "0.0.1"
description = "Toy benchmark for synthetic Hi-C contact maps and 3D reconstruction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "Your Name" }]
keywords = ["hi-c", "chromatin", "3d-genome", "benchmark", "polymer"]

# Runtime deps are managed via environment.yml (conda).
# This list stays minimal so `pip install -e .` works inside the conda env
# without re-resolving the heavy scientific stack.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[project.urls]
Repository = "https://example.com/your-org/hic-benchmark"

# ---------------------------------------------------------------------------
# Hatchling build config
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/hic_benchmark"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "NPY", # numpy-specific
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line too long (formatter handles it)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    # Add `ignore::SomeWarning:module` lines here as needed.
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Scientific libraries often lack stubs; loosen for them rather than the whole
# project.

[[tool.mypy.overrides]]
module = [
    "cooler.*",
    "cooltools.*",
    "scipy.*",
    "sklearn.*",
    "plotly.*",
    "seaborn.*",
]
ignore_missing_imports = true
